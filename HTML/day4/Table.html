<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>
<body>
    <table>
    <caption>Student details</caption>
    <!--Table header-->
    <thead>
        <tr>

            <th>Name</th>
            <th>Roll No.</th>
        </tr>
    </thead>
    <!--Table Body--> 
    <tbody>
         <tr>
            <td>sachin</td>
            <td>142</td>
        </tr>
        <tr>
            <td>manish</td>
            <td>51</td>
        </tr>
    </tbody>
       
    </table>
</body>
</html>
