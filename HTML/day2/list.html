 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
 </head>
 <body>
   <h3>Unordered list</h3>
    <ul>
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
        <li>Dosa</li>
        <li>Idli</li>

    </ul>
    <h3>ordered list</h3>
     <ol>
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
        <li>Dosa</li>
        <li>Idli</li>

    </ol>
     <ol type="a">
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
        <li>Dosa</li>
        <li>Idli</li>

    </ol>
 </body>
 </html>
